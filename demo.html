<!doctype html><meta charset="utf-8"><title>v05 demo capture</title>
<style>
html,body{margin:0;background:#eef3fa;font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;color:#22304f}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;background:linear-gradient(#f6faff,#e6eef9)}
#ground{position:absolute;left:0;right:0;top:612px;height:108px;background:linear-gradient(#dfe9f6,#d1def0)}
#sh{position:absolute;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(40,60,110,.28),rgba(40,60,110,0))}
#c{position:absolute;width:560px;height:616px}
#brand{position:absolute;left:56px;top:44px;font-size:20px;letter-spacing:.08em;color:#6d7fa3}
#cap{position:absolute;left:56px;top:250px;width:540px}
#cap h2{margin:0;font-size:58px;line-height:1.15;font-weight:700;letter-spacing:.01em}
#cap p{margin:18px 0 0;font-size:25px;line-height:1.6;color:#55688f}
#cap .n{font-size:20px;color:#8a9bbd;letter-spacing:.14em;margin-bottom:14px}
#title{position:absolute;left:56px;top:210px;width:560px}
#title h1{margin:0;font-size:92px;line-height:1.08;font-weight:800}
#title p{margin:22px 0 0;font-size:28px;color:#55688f;line-height:1.6}
#end{position:absolute;left:56px;top:190px;width:520px}
#end h1{margin:0;font-size:56px;line-height:1.2;font-weight:800}
#end p{margin:20px 0 0;font-size:24px;color:#55688f;line-height:1.7}
#end .u{margin-top:26px;font-size:26px;color:#22304f;font-weight:700}
</style>
<div id="stage"><div id="ground"></div><div id="sh"></div><canvas id="c" width="1120" height="1232"></canvas>
<div id="brand">我与AI们 · AI 桌宠</div>
<div id="title"><h1>大肥鱼</h1><p>DeepSeek 桌宠<br>会走、会吃饭、会干活，也会犯困</p></div>
<div id="cap"><div class="n"></div><h2></h2><p></p></div>
<div id="end"><h1>点一下，拖一拖，<br>右键选动作</h1><p>打开网页就能看到，她会自己逛，<br>隔一会儿换个动作。<br>接下来是 GPT、Claude、Gemini、Grok。</p><div class="u">github.com/hhxk233/ai-work-pet</div></div>
</div>
<script src="engine/pet-engine.js"></script><script src="characters/deepseek/rig.js"></script><script src="characters/deepseek/motions.js"></script><script src="characters/deepseek/load.js"></script>
<script>
(async()=>{ const c=document.getElementById('c'), sh=document.getElementById('sh'), $=id=>document.getElementById(id);
  const {pet,director}=await loadDeepSeek(c); const S=560/900; let x=+(new URLSearchParams(location.search).get('x')||600), T=0;
  // caption track: [start, end, number, title, subtitle]
  const CAPS=[[4.3,11.6,'01','待机','呼吸、眨眼、张望，头发尾巴跟着动'],[12.2,19.8,'02','自己走走','起步、迈步、停下，头发甩一下再落回'],
    [20.4,33.6,'03','吃白米饭','端碗，舀一勺，送到嘴边，慢慢嚼'],[34.3,47.2,'04','电脑开工','坐下，掀开电脑，打字，做完再合上'],
    [47.9,55.0,'05','想一想','拳头抵着下巴想一会儿，想到了跳一下'],[55.4,59.9,'06','打招呼','小手举到脸旁边挥一挥'],
    [60.2,65.3,'07','伸懒腰','双手举高，打个哈欠'],[65.8,68.6,'08','点她一下','先蹲，再跳起来'],
    [68.9,80.0,'09','抱鲸鱼','抱着小鲸鱼晃一晃，再趴到大鲸鱼上'],[80.2,92.0,'10','休息','坐着打瞌睡，头一点一点，然后睡着']];
  const win=(a,b,t,f)=>Math.max(0,Math.min(1,(t-a)/f))*Math.max(0,Math.min(1,(b-t)/f)), ez=u=>u*u*(3-2*u);
  const place=()=>{ c.style.left=x+'px'; c.style.top=(612+26-(905+40)*S)+'px'; const k=1-pet.P.jump/90, w=190*k;
    sh.style.width=w+'px'; sh.style.left=(x+(500-60)*S-w/2)+'px'; sh.style.top=(612+26-13)+'px'; sh.style.opacity=k; };
  const captions=()=>{ const ta=ez(win(0.4,3.9,T,0.5)); $('title').style.opacity=ta; $('title').style.transform=`translateY(${(1-ta)*14}px)`;
    const ea=ez(win(92.6,99.6,T,0.6)); $('end').style.opacity=ea; $('end').style.transform=`translateY(${(1-ea)*14}px)`;
    let a=0, cur=null; for(const k of CAPS){ const v=win(k[0],k[1],T,0.35); if(v>0){ a=ez(v); cur=k; } }
    const el=$('cap'); el.style.opacity=a; el.style.transform=`translateY(${(1-a)*12}px)`;
    if(cur){ el.querySelector('.n').textContent=cur[2]+' / 10'; el.querySelector('h2').textContent=cur[3]; el.querySelector('p').textContent=cur[4]; }
    $('brand').style.opacity=ez(win(0.2,99.8,T,0.6)); };
  window.cap={pet,director,step(dt){ T+=dt; director.update(pet,dt); pet.update(dt); x+=director.vx*S*dt; pet.draw(); place(); captions(); },
    cmd(s){ const [a,b]=s.split(':'); if(a==='walk')director.walk(+b); else if(a==='halt')director.halt(); else if(a==='play')director.play(b); } };
  for(let i=0;i<20;i++){ director.update(pet,1/30); pet.update(1/30); } pet.draw(); place(); captions(); window.ready=true; })().catch(e=>{window.err=String(e.stack||e)});
</script>
