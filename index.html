<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 桌宠 · 大肥鱼和白龙娘</title>
<style>
  :root { color-scheme: light; --ink:#22304f; --soft:#6d7fa3; --line:#d5e0f0; }
  html,body { margin:0; height:100%; font:15px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:var(--ink); background:linear-gradient(#f5f8fe,#e8edf9); overflow:hidden; }
  header { position:fixed; left:24px; top:18px; right:24px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; pointer-events:none; }
  h1 { font-size:18px; margin:0; letter-spacing:.02em; } header p { margin:2px 0 0; color:var(--soft); font-size:13px; max-width:46ch; }
  header a { pointer-events:auto; color:var(--ink); text-decoration:none; border:1px solid var(--line); background:rgba(255,255,255,.8); border-radius:999px; padding:7px 14px; margin-left:8px; font-size:13px; white-space:nowrap; }
  header .links { display:flex; }
  #pets { pointer-events:auto; display:inline-flex; gap:2px; margin-top:10px; padding:3px; background:rgba(255,255,255,.86); border:1px solid var(--line); border-radius:999px; }
  #pets button { padding:6px 14px; white-space:nowrap; }
  #floor { position:fixed; left:0; right:0; bottom:0; height:17vh; background:linear-gradient(#dde6f6,#d0daef); }
  canvas.pet { position:fixed; bottom:calc(17vh - 26px); left:0; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; }
  canvas.pet.drag { cursor:grabbing; }
  #shadow { position:fixed; bottom:calc(17vh - 12px); height:24px; border-radius:50%; background:radial-gradient(closest-side,rgba(40,60,110,.26),rgba(40,60,110,0)); pointer-events:none; }
  nav { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); display:flex; gap:4px; max-width:96vw; overflow-x:auto; white-space:nowrap; padding:6px; background:rgba(255,255,255,.86); border:1px solid var(--line); border-radius:999px; backdrop-filter:blur(8px); }
  button { font:inherit; color:var(--ink); background:transparent; border:0; padding:7px 14px; border-radius:999px; cursor:pointer; }
  button:hover, button[aria-pressed="true"] { background:#e4edfb; }
  #menu { position:fixed; display:none; flex-direction:column; min-width:132px; padding:6px; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(40,60,110,.16); z-index:5; }
  #menu button { text-align:left; border-radius:9px; }
  #wait { position:fixed; left:50%; top:45%; transform:translate(-50%,-50%); color:var(--soft); font-size:14px; }
  @media (max-width:520px){ header p{display:none} nav{max-width:94vw; overflow-x:auto} #pets .who{display:none} #pets button{padding:6px 11px} }
</style>
</head>
<body>
<header><div><h1 id="title">AI 桌宠的小房间</h1><p>点她一下会跳，拖动换位置，右键或长按选动作。</p><div id="pets" role="group" aria-label="换桌宠"></div></div><div class="links"></div></header>
<div id="floor"></div><div id="shadow"></div>
<div id="wait" hidden>正在叫她过来…</div>
<nav id="acts" aria-label="动作"></nav>
<div id="menu" role="menu"></div>
<script src="engine/pet-engine.js"></script>
<script src="engine/director.js"></script>
<script>
// Each pet: where its files are, the loader its load.js defines, and its action buttons.
const PETS = {
  deepseek: { name: '大肥鱼', who: 'DeepSeek', dir: 'characters/deepseek/', ext: 'DEEPSEEK_EXT', loader: 'loadDeepSeek', view: 60,
    acts: [['rice', '吃白米饭'], ['laptop', '电脑开工'], ['typing', '敲键盘'], ['think', '思考'], ['wave', '挥手'], ['stretch', '伸懒腰'], ['whale', '抱鲸鱼'], ['rest', '休息'], ['jump', '跳']] },
  gpt: { name: '白龙娘', who: 'GPT', dir: 'characters/gpt/', ext: 'GPT_EXT', loader: 'loadGPT', view: 50,
    acts: [['cookie', '吃小饼干'], ['laptop', '笔记本'], ['mug', '喝一口'], ['think', '想一想'], ['wave', '挥手'], ['pout', '吃醋'], ['pillow', '白龙抱枕'], ['stretch', '伸懒腰'], ['sleep', '晚安'], ['jump', '跳']] },
};
const get = k => { try { return localStorage.getItem(k); } catch { return null; } }, set = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const loadScript = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.append(s); });
(async () => {
  const q = new URLSearchParams(location.search).get('pet');
  let cur = PETS[q] ? q : PETS[get('ai-pet-choice')] ? get('ai-pet-choice') : 'deepseek';
  const sh = document.getElementById('shadow'), menu = document.getElementById('menu'), nav = document.getElementById('acts'), tabs = document.getElementById('pets'), wait = document.getElementById('wait');
  const H = () => Math.max(280, Math.min(490, innerHeight * 0.55)), view = { w: 900, h: 990 };
  let cssH, cssW, S, dpr = Math.min(2, devicePixelRatio || 1);
  const apps = {}, loading = {};
  const size = () => { cssH = H(); cssW = cssH * view.w / view.h; S = cssH / view.h;
    for (const k in apps) { const c = apps[k].c; c.style.width = cssW + 'px'; c.style.height = cssH + 'px'; c.width = Math.round(cssW * dpr); c.height = Math.round(cssH * dpr); } };
  async function boot(key) {                    // one canvas per pet, loaded the first time she is picked
    const P = PETS[key];                            // this copy uses the PNG textures in characters/; web/index.html uses WebP
    for (const f of ['rig.js', 'motions.js', 'load.js']) await loadScript(P.dir + f);
    const c = document.createElement('canvas'); c.className = 'pet'; c.hidden = true; document.body.insertBefore(c, nav);
    apps[key] = { c }; size(); bindPointer(c);
    const { pet, director } = await window[P.loader](c, P.dir);
    return Object.assign(apps[key], { pet, director });
  }
  const getApp = key => loading[key] = loading[key] || boot(key);

  let app = null, x = innerWidth * 0.5, auto = true, idleFor = 0, nextAt = 3, walkLeft = 0, press = null, drag = null;
  const act = a => { menu.style.display = 'none'; idleFor = 0; if (!app) return; const d = app.director;
    if (a === 'walkL' || a === 'walkR') { d.stop(); d.walk(a === 'walkL' ? -1 : 1); walkLeft = 2.6; }
    else if (a === 'halt') { d.halt(); walkLeft = 0; } else { d.halt(); walkLeft = 0; d.play(a); } };
  const buttons = () => { const A = PETS[cur].acts;
    nav.innerHTML = A.map(a => `<button data-act="${a[0]}">${a[1]}</button>`).join('') + '<button data-act="walkL">← 走</button><button data-act="walkR">走 →</button><button id="auto" aria-pressed="' + auto + '">自动闲逛</button>';
    menu.innerHTML = A.map(a => `<button data-act="${a[0]}">${a[1]}</button>`).join('') + '<button data-act="walkL">向左走走</button><button data-act="walkR">向右走走</button><button data-act="halt">停下</button>';
    tabs.innerHTML = Object.keys(PETS).map(k => `<button data-pet="${k}" aria-pressed="${k === cur}">${PETS[k].name}<span class="who"> · ${PETS[k].who}</span></button>`).join('');
    document.getElementById('title').textContent = PETS[cur].name + '的小房间'; document.title = PETS[cur].name + ' · AI 桌宠'; };
  document.addEventListener('click', e => { const b = e.target.closest('[data-act]'), p = e.target.closest('[data-pet]');
    if (b) { e.stopPropagation(); act(b.dataset.act); } if (p) pick(p.dataset.pet);
    if (e.target.id === 'auto') { auto = !auto; e.target.setAttribute('aria-pressed', auto); if (!auto && app) { app.director.halt(); walkLeft = 0; } } });
  async function pick(key) {
    cur = key; set('ai-pet-choice', key); buttons(); const u = new URL(location.href); u.searchParams.set('pet', key); history.replaceState(null, '', u);
    if (!apps[key] || !apps[key].pet) wait.hidden = false;
    try { const a = await getApp(key); if (cur !== key) return; wait.hidden = true;
      if (app && app !== a) { app.c.hidden = true; app.director.halt(); } const first = !app; app = a; app.c.hidden = false; walkLeft = 0; idleFor = 0;
      if (first) x = innerWidth * 0.5 - cssW / 2; else app.director.play('happy'); }
    catch (e) { wait.textContent = '没能加载 ' + PETS[key].name + '，刷新试试'; console.error(e); }
  }
  // click / drag / context menu / long-press
  const openMenu = (px, py) => { menu.style.display = 'flex'; menu.style.left = Math.min(px, innerWidth - 150) + 'px'; menu.style.top = Math.max(8, Math.min(py - 20, innerHeight - 260)) + 'px'; };
  function bindPointer(c) {
    c.addEventListener('pointerdown', e => { if (e.button === 2 || !app) return; c.setPointerCapture(e.pointerId); press = { x: e.clientX, y: e.clientY, x0: x, moved: false, timer: setTimeout(() => { if (press && !press.moved) { openMenu(press.x, press.y); press = null; } }, 520) }; });
    c.addEventListener('pointermove', e => { if (!press) return; const dx = e.clientX - press.x; if (Math.abs(dx) > 5 || Math.abs(e.clientY - press.y) > 5) { press.moved = true; clearTimeout(press.timer); c.classList.add('drag'); app.director.halt(); walkLeft = 0; } if (press.moved) { const nx = press.x0 + dx; drag = { v: nx - x }; x = nx; } });
    const up = () => { if (!press) return; clearTimeout(press.timer); c.classList.remove('drag'); if (!press.moved && !app.director.busy) act('jump'); press = null; drag = null; };
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    c.addEventListener('contextmenu', e => { e.preventDefault(); openMenu(e.clientX, e.clientY); });
  }
  addEventListener('pointerdown', e => { if (!menu.contains(e.target) && !(e.target.classList && e.target.classList.contains('pet'))) menu.style.display = 'none'; });
  addEventListener('resize', size);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (app) { const { pet, director } = app;
      if (auto && !press) {                       // roam: stroll now and then, sometimes do something
        if (walkLeft > 0) { walkLeft -= dt; if (walkLeft <= 0) director.halt(); }
        else if (!director.busy && director.walkW === 0) { idleFor += dt; if (idleFor > nextAt) { idleFor = 0; nextAt = 3 + Math.random() * 5; const r = Math.random();
          if (r < 0.55) { const mid = x + cssW / 2; const dir = mid < innerWidth * 0.25 ? 1 : mid > innerWidth * 0.75 ? -1 : (Math.random() < 0.5 ? -1 : 1); director.walk(dir); walkLeft = 1.6 + Math.random() * 2.4; }
          else { const A = PETS[cur].acts; director.play(A[Math.floor(Math.random() * A.length)][0]); } } }
      } else if (walkLeft > 0) { walkLeft -= dt; if (walkLeft <= 0) director.halt(); }
      director.update(pet, dt);
      if (drag) { pet.P.lean += Math.max(-14, Math.min(14, drag.v * 1.4)); drag.v *= 0.8; }   // dragging tugs the body; hair and tail follow through
      pet.update(dt); pet.draw();
      x += director.vx * S * dt; const minX = -cssW * 0.25, maxX = innerWidth - cssW * 0.75;
      if (x < minX) { x = minX; if (director.walkTarget) director.walk(1); } if (x > maxX) { x = maxX; if (director.walkTarget) director.walk(-1); }
      app.c.style.transform = `translate3d(${x}px,0,0)`;
      const k = 1 - pet.P.jump / 90, sw = 190 * S * 1.05 * k * (cur === 'gpt' ? 1.2 : 1); sh.style.width = sw + 'px'; sh.style.left = (x + (500 - PETS[cur].view) * S - sw / 2) + 'px'; sh.style.opacity = k;
      window.petRoom = { pet, director, name: cur, pick };
    }
    requestAnimationFrame(frame);
  }
  buttons(); size(); await pick(cur); requestAnimationFrame(frame);
})().catch(e => { document.body.insertAdjacentHTML('beforeend', '<pre style="position:fixed;left:24px;top:90px;color:#b00">' + (e.stack || e) + '</pre>'); });
</script>
</body>
</html>
