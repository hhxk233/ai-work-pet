<script>
const states=[['眨眼呼吸',0,[280,110,110,140,140,320]],['向右小跑',1,[120,120,120,120,120,120,120,220]],['向左小跑',2,[120,120,120,120,120,120,120,220]],['挥挥手',3,[140,140,140,280]],['开心跳跃',4,[140,140,140,140,280]],['委屈振作',5,[140,140,140,140,140,140,140,240]],['抱小鲸鱼',6,[150,150,150,150,150,260]],['电脑开工',7,[120,120,120,120,120,220]],['吃白米饭',8,[150,150,150,150,150,280]]];
const pet=document.querySelector('#pet'),status=document.querySelector('#status'),actions=document.querySelector('#actions'),gaze=document.querySelector('#gaze'),pause=document.querySelector('#pause');
let selected=0,index=0,timer=null,paused=false,direction=null;
function paint(row,col){pet.style.backgroundPosition=`${-col*192}px ${-row*208}px`;}
function tick(){clearTimeout(timer);if(direction!==null){paint(9+Math.floor(direction/8),direction%8);return;}const s=states[selected];paint(s[1],index);if(!paused)timer=setTimeout(()=>{index=(index+1)%s[2].length;tick();},s[2][index]);}
function choose(i){selected=i;index=0;direction=null;gaze.value='';status.textContent=`${states[i][0]} · ${states[i][2].length} 帧`;[...actions.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));tick();}
states.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[0];b.onclick=()=>choose(i);b.setAttribute('aria-pressed',String(i===0));actions.append(b);});
const directions=['上','右上偏上','右上','右上偏右','右','右下偏右','右下','右下偏下','下','左下偏下','左下','左下偏左','左','左上偏左','左上','左上偏上'];
directions.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${s} · ${i*22.5}°`;gaze.append(o);});
gaze.onchange=()=>{if(gaze.value===''){choose(selected);return;}direction=Number(gaze.value);status.textContent=`视线：${directions[direction]}`;tick();};pause.onclick=()=>{paused=!paused;pause.textContent=paused?'继续':'暂停';pause.setAttribute('aria-pressed',String(paused));tick();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer);else tick();});tick();
</script>
